<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime Downloads</title>

  <style>

    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    #search{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-bottom:20px;
      font-size:16px;
    }

    #files{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:#1a1a1a;
      border-radius:15px;
      overflow:hidden;
      padding:15px;
    }

    .card img{
      width:100%;
      border-radius:10px;
      height:300px;
      object-fit:cover;
    }

    .card h2{
      margin-top:10px;
    }

    .download-btn{
      display:inline-block;
      background:red;
      color:white;
      padding:10px 15px;
      border-radius:8px;
      text-decoration:none;
      margin-top:10px;
    }

  </style>
</head>

<body>

<h1>Anime Downloads</h1>

<input
  type="text"
  id="search"
  placeholder="Search anime..."
>

<div id="files"></div>

<script>

const SUPABASE_URL =
"https://tjywibuhotmngbreawxe.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeXdpYnVob3RtbmdicmVhd3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzIxODcsImV4cCI6MjA5NTQ0ODE4N30.QjXotnfpHez5nOxV76BB--fWZsloXMxAC5seAIqEtPI";

let allFiles = [];

async function loadFiles(){

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/files?select=*`,
    {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await response.json();

  allFiles = data;

  renderFiles(data);
}

function renderFiles(files){

  const container =
  document.getElementById("files");

  container.innerHTML = "";

  files.forEach(file => {

    container.innerHTML += `
      <div class="card">

        <img src="${file.poster_url}">

        <h2>${file.title}</h2>

        <p>${file.description}</p>

        <p>${file.file_size}</p>

        <a
          class="download-btn"
          href="${file.download_url}"
          download
        >
          Download
        </a>

      </div>
    `;
  });
}

document
.getElementById("search")
.addEventListener("input", e => {

  const value =
  e.target.value.toLowerCase();

  const filtered =
  allFiles.filter(file =>
    file.title.toLowerCase().includes(value)
  );

  renderFiles(filtered);

});

loadFiles();

</script>

</body>
</html>
