<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Library</title>

<style>

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial;
  padding:20px;
}

h1{text-align:center}

#search{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
}

#categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.cat-btn{
  padding:8px 12px;
  border:none;
  border-radius:20px;
  background:#333;
  color:white;
  cursor:pointer;
}

.cat-btn.active{
  background:red;
}

#files{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:10px;
}

.download{
  display:inline-block;
  margin-top:10px;
  background:red;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  text-decoration:none;
}

</style>
</head>

<body>

<h1>Anime Library</h1>

<input id="search" placeholder="Search anime...">

<div id="categories"></div>

<div id="files"></div>

<script>

const SUPABASE_URL = "https://tjywibuhotmngbreawxe.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeXdpYnVob3RtbmdicmVhd3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzIxODcsImV4cCI6MjA5NTQ0ODE4N30.QjXotnfpHez5nOxV76BB--fWZsloXMxAC5seAIqEtPI";

let allFiles = [];
let currentCategory = "all";

async function loadFiles(){

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/files?select=*`,
    {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  allFiles = await res.json();

  buildCategories();
  render();
}

function buildCategories(){

  const container = document.getElementById("categories");

  const cats = ["all", ...new Set(allFiles.map(f => f.category))];

  container.innerHTML = "";

  cats.forEach(cat => {

    container.innerHTML += `
      <button class="cat-btn ${cat === "all" ? "active" : ""}"
      onclick="setCategory('${cat}')">
        ${cat}
      </button>
    `;
  });
}

function setCategory(cat){
  currentCategory = cat;

  document.querySelectorAll(".cat-btn")
  .forEach(b => b.classList.remove("active"));

  event.target.classList.add("active");

  render();
}

function render(){

  const search = document.getElementById("search").value.toLowerCase();

  let filtered = allFiles;

  if(currentCategory !== "all"){
    filtered = filtered.filter(f => f.category === currentCategory);
  }

  if(search){
    filtered = filtered.filter(f =>
      f.title.toLowerCase().includes(search)
    );
  }

  const container = document.getElementById("files");

  container.innerHTML = "";

  filtered.forEach(file => {

    container.innerHTML += `
      <div class="card">

        <img src="${file.poster_url}">

        <h3>${file.title}</h3>

        <p>${file.category}</p>

        <a class="download" href="${file.download_url}">
          Download
        </a>

      </div>
    `;
  });
}

document.getElementById("search")
.addEventListener("input", render);

loadFiles();

</script>

</body>
</html>
