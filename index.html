<!DOCTYPE html>
<html>
<head>
  <title>Anime Downloads</title>

  <style>
    body{
      font-family: Arial;
      background:#111;
      color:white;
      padding:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:20px;
      border:none;
      border-radius:8px;
    }

    .card{
      background:#1c1c1c;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
    }

    img{
      width:150px;
      border-radius:8px;
    }

    a{
      display:inline-block;
      margin-top:10px;
      padding:10px 15px;
      background:#ff3c3c;
      color:white;
      text-decoration:none;
      border-radius:6px;
    }
  </style>
</head>

<body>

<h1>Anime Downloads</h1>

<input
  type="text"
  id="search"
  placeholder="Search anime..."
>

<div id="files"></div>

<script>

const SUPABASE_URL =
"https://tjywibuhotmngbreawxe.supabase.co";

const SUPABASE_KEY =
eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeXdpYnVob3RtbmdicmVhd3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzIxODcsImV4cCI6MjA5NTQ0ODE4N30.QjXotnfpHez5nOxV76BB--fWZsloXMxAC5seAIqEtPI

async function loadFiles(){

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/files?select=*`,
    {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await response.json();

  window.allFiles = data;

  renderFiles(data);
}

function renderFiles(files){

  const container =
  document.getElementById("files");

  container.innerHTML = "";

  files.forEach(file => {

    container.innerHTML += `
      <div class="card">

        <img src="${file.poster_url}">

        <h2>${file.title}</h2>

        <p>${file.description || ""}</p>

        <p>${file.file_size || ""}</p>

        <a href="${file.download_url}" download>
          Download
        </a>

      </div>
    `;
  });
}

document
.getElementById("search")
.addEventListener("input", e => {

  const value =
  e.target.value.toLowerCase();

  const filtered =
  window.allFiles.filter(file =>
    file.title.toLowerCase().includes(value)
  );

  renderFiles(filtered);
});

loadFiles();

</script>

</body>
</html>
