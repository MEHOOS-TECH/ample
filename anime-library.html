<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniVault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #080810;
  --surface: #10101e;
  --card: #14142a;
  --border: #1e1e38;
  --accent: #e63946;
  --accent2: #ff6b35;
  --text: #f0f0f8;
  --muted: #7070a0;
  --green: #2ecc71;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  position: relative;
}

.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

#search {
  width: 100%;
  padding: 10px 14px 10px 38px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

#search:focus {
  border-color: var(--accent);
}

#search::placeholder { color: var(--muted); }

/* ── CATEGORIES ── */
#categories {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
#categories::-webkit-scrollbar { display: none; }

.cat-btn {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.cat-btn:hover { border-color: var(--accent); color: var(--text); }

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ── ANIME GRID ── */
#home-view { position: relative; z-index: 1; }

#grid-label {
  padding: 18px 20px 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

#files {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  padding: 0 20px 30px;
}

.card {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.2s, border-color 0.2s;
  animation: fadeUp 0.4s ease both;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-poster {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  background: var(--surface);
}

.card-poster-placeholder {
  width: 100%;
  height: 200px;
  background: linear-gradient(135deg, #1a1a30, #0e0e20);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

.card-info {
  padding: 10px 10px 12px;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}

.rating {
  display: flex;
  align-items: center;
  gap: 3px;
  color: #f5c518;
  font-weight: 600;
  font-size: 12px;
}

/* ── EMPTY / LOADING ── */
.state-msg {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── DETAIL VIEW ── */
#detail-view {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  overflow-y: auto;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}

.detail-hero {
  position: relative;
  height: 280px;
}

.detail-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.35);
}

.detail-bg-placeholder {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #1a0010, #0e0e20);
}

.detail-back {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  backdrop-filter: blur(6px);
}

.detail-poster-wrap {
  position: absolute;
  bottom: -50px;
  left: 20px;
  width: 100px;
  height: 140px;
  border-radius: 10px;
  overflow: hidden;
  border: 3px solid var(--bg);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}

.detail-poster {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.detail-body {
  padding: 60px 20px 20px;
}

.detail-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 8px;
}

.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.tag {
  padding: 3px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  color: var(--muted);
}

.tag.accent { background: rgba(230,57,70,0.15); border-color: var(--accent); color: var(--accent); }

.detail-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 20px;
  font-weight: 700;
  color: #f5c518;
  margin-bottom: 14px;
}

.detail-desc {
  font-size: 13px;
  line-height: 1.7;
  color: #b0b0c8;
  margin-bottom: 24px;
}

/* ── EPISODES ── */
.episodes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.episodes-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
}

.ep-count {
  font-size: 12px;
  color: var(--muted);
}

.season-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin: 18px 0 10px;
  padding-left: 4px;
  border-left: 3px solid var(--accent);
  padding-left: 8px;
}

.ep-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: border-color 0.2s;
}

.ep-card:hover { border-color: var(--accent); }

.ep-left { flex: 1; min-width: 0; }

.ep-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 3px;
}

.ep-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ep-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

.dl-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.1s;
}

.dl-btn:hover { background: #c0303c; transform: scale(0.97); }

.no-eps {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 13px;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>

<!-- ── HOME VIEW ── -->
<div id="home-view">

  <header>
    <div class="logo">AniVault</div>
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="Search anime, genre...">
    </div>
  </header>

  <div id="categories"></div>

  <div id="grid-label">All Anime</div>
  <div id="files"></div>

</div>

<!-- ── DETAIL VIEW ── -->
<div id="detail-view">

  <div class="detail-hero">
    <img id="detail-bg" class="detail-bg" src="" alt="">
    <button class="detail-back" onclick="closeDetail()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="detail-poster-wrap">
      <img id="detail-poster" class="detail-poster" src="" alt="">
    </div>
  </div>

  <div class="detail-body">
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-tags" id="detail-tags"></div>
    <div class="detail-rating" id="detail-rating"></div>
    <div class="detail-desc" id="detail-desc"></div>

    <div class="episodes-header">
      <div class="episodes-title">Episodes</div>
      <div class="ep-count" id="ep-count"></div>
    </div>
    <div id="episodes-list"></div>
  </div>

</div>

<div id="toast"></div>

<script>

const SUPABASE_URL = "https://tjywibuhotmngbreawxe.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeXdpYnVob3RtbmdicmVhd3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzIxODcsImV4cCI6MjA5NTQ0ODE4N30.QjXotnfpHez5nOxV76BB--fWZsloXMxAC5seAIqEtPI";

const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

let allAnime = [];
let currentCategory = "all";

// ── FETCH ANIME ──
async function loadAnime() {
  showLoading();
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/anime?select=*&order=created_at.desc`, { headers: H });
    if (!res.ok) throw new Error(await res.text());
    allAnime = await res.json();
    buildCategories();
    render();
  } catch (e) {
    showError(e.message);
  }
}

// ── CATEGORIES ──
function buildCategories() {
  const container = document.getElementById("categories");
  const cats = ["all", ...new Set(allAnime.map(a => a.category).filter(Boolean))];
  container.innerHTML = cats.map(cat => `
    <button class="cat-btn ${cat === "all" ? "active" : ""}" onclick="setCategory('${cat}', this)">
      ${cat === "all" ? "All" : cat}
    </button>
  `).join("");
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

// ── RENDER GRID ──
function render() {
  const search = document.getElementById("search").value.toLowerCase().trim();
  let filtered = allAnime;

  if (currentCategory !== "all") {
    filtered = filtered.filter(a => a.category === currentCategory);
  }

  if (search) {
    filtered = filtered.filter(a =>
      (a.title || "").toLowerCase().includes(search) ||
      (a.genre || "").toLowerCase().includes(search) ||
      (a.category || "").toLowerCase().includes(search)
    );
  }

  const label = document.getElementById("grid-label");
  label.textContent = search
    ? `Results for "${search}"`
    : currentCategory === "all" ? "All Anime" : currentCategory;

  const container = document.getElementById("files");

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="state-msg">
        <div style="font-size:40px;margin-bottom:10px">🔍</div>
        <div>No anime found</div>
        <div style="font-size:12px;margin-top:6px">Try a different search or category</div>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map((a, i) => `
    <div class="card" onclick="openDetail('${a.id}')" style="animation-delay:${i * 0.04}s">
      ${a.poster_url
        ? `<img class="card-poster" src="${a.poster_url}" alt="${a.title}" loading="lazy">`
        : `<div class="card-poster-placeholder">🎌</div>`}
      <div class="card-info">
        <div class="card-title">${a.title}</div>
        <div class="card-meta">
          <span>${a.genre || a.category || ""}</span>
          ${a.rating ? `<span class="rating">★ ${a.rating}</span>` : ""}
        </div>
      </div>
    </div>
  `).join("");
}

// ── OPEN DETAIL ──
async function openDetail(animeId) {
  const anime = allAnime.find(a => a.id === animeId);
  if (!anime) return;

  // Fill hero
  if (anime.poster_url) {
    document.getElementById("detail-bg").src = anime.poster_url;
    document.getElementById("detail-bg").style.display = "block";
    document.getElementById("detail-poster").src = anime.poster_url;
  } else {
    document.getElementById("detail-bg").style.display = "none";
  }

  document.getElementById("detail-title").textContent = anime.title;

  // Tags
  const tags = [];
  if (anime.category) tags.push(`<span class="tag accent">${anime.category}</span>`);
  if (anime.genre) tags.push(`<span class="tag">${anime.genre}</span>`);
  if (anime.year) tags.push(`<span class="tag">${anime.year}</span>`);
  document.getElementById("detail-tags").innerHTML = tags.join("");

  // Rating
  document.getElementById("detail-rating").innerHTML = anime.rating
    ? `★ ${anime.rating} <span style="font-size:13px;color:var(--muted);font-weight:400">/ 10</span>`
    : "";

  document.getElementById("detail-desc").textContent = anime.description || "";

  // Episodes
  const epList = document.getElementById("episodes-list");
  epList.innerHTML = `<div class="state-msg"><div class="spinner"></div>Loading episodes...</div>`;

  document.getElementById("detail-view").style.display = "block";
  window.scrollTo(0, 0);

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/episodes?anime_id=eq.${animeId}&order=season.asc,episode_number.asc`,
      { headers: H }
    );
    if (!res.ok) throw new Error(await res.text());
    const episodes = await res.json();

    document.getElementById("ep-count").textContent =
      episodes.length > 0 ? `${episodes.length} episode${episodes.length > 1 ? "s" : ""}` : "";

    if (episodes.length === 0) {
      epList.innerHTML = `<div class="no-eps">🎬 No episodes uploaded yet</div>`;
      return;
    }

    // Group by season
    const seasons = {};
    episodes.forEach(ep => {
      const s = ep.season || 1;
      if (!seasons[s]) seasons[s] = [];
      seasons[s].push(ep);
    });

    let html = "";
    Object.keys(seasons).sort((a, b) => a - b).forEach(season => {
      if (Object.keys(seasons).length > 1) {
        html += `<div class="season-label">Season ${season}</div>`;
      }
      seasons[season].forEach(ep => {
        const epLabel = `S${String(season).padStart(2,"0")} EP${String(ep.episode_number).padStart(2,"0")}`;
        html += `
          <div class="ep-card">
            <div class="ep-left">
              <div class="ep-num">${epLabel}</div>
              <div class="ep-title">${ep.title || "Episode " + ep.episode_number}</div>
              <div class="ep-meta">
                ${ep.file_size ? ep.file_size : ""}
                ${ep.file_size && ep.uploaded_by ? " · " : ""}
                ${ep.uploaded_by ? "by " + ep.uploaded_by : ""}
              </div>
            </div>
            ${ep.download_url
              ? `<a class="dl-btn" href="${ep.download_url}" target="_blank">
                  <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Download
                </a>`
              : `<span style="font-size:11px;color:var(--muted)">No link</span>`}
          </div>`;
      });
    });
    epList.innerHTML = html;

  } catch (e) {
    epList.innerHTML = `<div class="no-eps" style="color:var(--accent)">Error loading episodes</div>`;
    showToast("Failed to load episodes: " + e.message);
  }
}

// ── CLOSE DETAIL ──
function closeDetail() {
  const dv = document.getElementById("detail-view");
  dv.style.animation = "none";
  dv.style.transform = "translateX(100%)";
  dv.style.transition = "transform 0.3s ease";
  setTimeout(() => {
    dv.style.display = "none";
    dv.style.transform = "";
    dv.style.transition = "";
    dv.style.animation = "";
  }, 300);
}

// ── HELPERS ──
function showLoading() {
  document.getElementById("files").innerHTML = `
    <div class="state-msg">
      <div class="spinner"></div>
      Loading anime...
    </div>`;
}

function showError(msg) {
  document.getElementById("files").innerHTML = `
    <div class="state-msg">
      <div style="font-size:36px;margin-bottom:10px">⚠️</div>
      <div style="color:var(--accent)">Failed to load</div>
      <div style="font-size:11px;margin-top:6px;color:var(--muted)">${msg}</div>
    </div>`;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ── SEARCH ──
document.getElementById("search").addEventListener("input", render);

// ── BACK BUTTON (Android) ──
window.addEventListener("popstate", () => {
  if (document.getElementById("detail-view").style.display === "block") {
    closeDetail();
  }
});

// ── INIT ──
loadAnime();

</script>
</body>
</html>
